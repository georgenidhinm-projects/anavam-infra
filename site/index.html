<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anavam Group</title>
<meta name="description" content="Anavam Group, a family company in Calgary, Alberta.">
<style>
  :root { --ink: #1d2433; --muted: #5b6475; --bg: #f7f6f2; --rule: #d9d6cc; }
  @media (prefers-color-scheme: dark) { :root { --ink: #ecebe6; --muted: #a8adb8; --bg: #15181f; --rule: #2c313c; } }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.6 Georgia, "Times New Roman", serif; }
  main { max-width: 34rem; margin: 18vh auto 4rem; padding: 0 16px; }
  h1 { font-weight: normal; font-size: 2.2rem; letter-spacing: 0.02em; margin: 0 0 0.5rem; }
  p { margin: 0 0 1rem; }
  .muted { color: var(--muted); }
  hr { border: 0; border-top: 1px solid var(--rule); margin: 2rem 0; }
  a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Anavam Group</h1>
  <p>A family company in Calgary, Alberta.</p>
  <hr>
  <p class="muted">Contact: <a href="mailto:hello@anavamgroup.ca">hello@anavamgroup.ca</a></p>
</main>
</body>
</html>
